name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Check Python style
        run: |
          ruff check ai_dashboard tests
          ruff format --check ai_dashboard tests

      - name: Run tests
        run: pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Page tests (browser-level, jsdom)
        run: |
          npm install --no-audit --no-fund
          npm test
